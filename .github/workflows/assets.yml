name: Generate Assets

on:
  # every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # manual trigger
  workflow_dispatch:
  # on push to default branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1) contribution snake -> dist/github-snake*.svg
      #    (Platane/snk is a Docker action running as root, so dist/ ends up root-owned)
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # 2) trophy renderer (Deno project with the custom light palette)
      - name: Checkout trophy renderer
        uses: actions/checkout@v4
        with:
          repository: AtomsH4/github-profile-trophy
          ref: master
          path: trophy-src

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      # 3) assemble everything into a runner-owned dir (avoids root-owned dist write error)
      - name: Assemble assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          sudo cp dist/*.svg public/ 2>/dev/null || cp dist/*.svg public/
          cd trophy-src
          printf 'GITHUB_TOKEN1=%s\n' "$GH_TOKEN" > .env
          if ! deno run --allow-net --allow-env --allow-read --allow-write \
            ./render_svg.ts "${{ github.repository_owner }}" "$GITHUB_WORKSPACE/public/trophy.svg" flat; then
            echo "::warning::Trophy renderer failed; using the previous trophy with white card backgrounds."
            curl --fail --silent --show-error \
              "https://raw.githubusercontent.com/${{ github.repository }}/output/trophy.svg" \
              | sed \
                  -e 's/#141321/#FFFFFF/g' \
                  -e 's/#EEEEEE/#FFFFFF/g' \
                  -e 's/#fe428e/#FF2E97/g' \
                  -e 's/#a9fef7/#24292F/g' \
                  -e 's/#50fa7b/#00A6B8/g' \
                  -e 's/#ffce32/#FF2E97/g' \
                  -e 's/#CB8A30/#24292F/g' \
                  -e 's/#8DF7B5/#00A6B8/g' \
                  -e 's/#3A3A3A/#24292F/g' \
                  -e 's/#EA3F25/#D0D7DE/g' \
                  -e 's/#1E65F5/#94A3B8/g' \
                  -e 's/#ff5555/#FF2E97/g' \
                  -e 's/#ff15d9/#00E5FF/g' \
                  -e 's/#ff61c6/#FF2E97/g' \
                  -e 's/fill="#FFFFFF">S<\/text>/fill="#24292F">S<\/text>/g' \
                  -e 's/fill="#FFFFFF">A<\/text>/fill="#24292F">A<\/text>/g' \
              > "$GITHUB_WORKSPACE/public/trophy.svg"
          fi
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/public" || true
          ls -la "$GITHUB_WORKSPACE/public"

      # 4) publish all generated assets to the output branch
      - name: Push generated assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
